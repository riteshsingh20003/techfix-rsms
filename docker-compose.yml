services:
  postgres:
    image: postgres:16-alpine
    container_name: techfix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: techfix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - techfix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d techfix"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  techfix_pgdata:
